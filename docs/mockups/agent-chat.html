<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>对话 · Agent Nexus</title>
<script src="../../agent_nexus/static/ui/appearance.js"></script>
<link rel="stylesheet" href="../../agent_nexus/static/ui/tokens.css">
<link rel="stylesheet" href="../../agent_nexus/static/ui/ui.css">
<link rel="stylesheet" href="../../agent_nexus/static/ui/style-pure.css">
<link rel="stylesheet" href="../../agent_nexus/static/ui/style-mica.css">
<script type="module" src="mock.js"></script>
</head>
<!-- The real shell + router with the 对话 page and the Overview's 对话 card (ui/chat-page.js, docs/agent-chat.md §16),
     on the in-memory AgentHub of agent-fake-api.js. Routes: #/ (概览 with the card), #/chat, #/inbox (another page, to
     check that leaving and coming back keeps the run). Query flags (besides mock.js's ?theme= / ?style=):
     ?state=new     start on a new conversation (#/chat?new=1) instead of the active session
     ?state=first   a device with no sessions at all
     ?keep=1        keep the stored chat state (anx-chat:local) from the last visit instead of starting clean
     ?side=open     open the session drawer (narrow widths; wide layouts show the list already)
     ?collapsed=1   start with the session list collapsed (the stored `sideClosed`, wide layouts)
     ?menu=agent|dir|more|perm|device   open that popover once loaded
     ?answer=1      answer the pending approval (shows the resolved state)
     ?gw=off        本机 not joined to a gateway: only 本机 and its folders (a stored gateway context is blocked)
     ?ctx=1         open a session that works on 工作电脑's folder through the gateway (Codex, no connector: the warning)
     The 目录 menu lists the other devices of the network: 工作电脑 and the long-named GPU server (agents/1: their own
     recent folders), 研发构建机 (no agents/1: workdirs + files/1 browsing), 家里的 NAS (offline). -->
<body>
<script type="module">
import { renderShell, createRouter, el, mount, toast, icon, appearanceButton } from "../../agent_nexus/static/ui/ui.js";
import { chatPage, chatCard, chatStorageKey } from "../../agent_nexus/static/ui/chat-page.js";
import { createFakeApi } from "./agent-fake-api.js";

const q = new URLSearchParams(location.search);
if (!q.get("keep")) {
  try { localStorage.removeItem(chatStorageKey(true)); } catch { /* private mode */ }
  if (q.get("collapsed")) try { localStorage.setItem(chatStorageKey(true), JSON.stringify({ sideClosed: true })); } catch { /* private mode */ }
  if (!location.hash || location.hash === "#/") {
    history.replaceState(null, "", q.get("state") ? "#/chat?new=1" : q.get("ctx") ? "#/chat?device=dev-mbp&kind=codex&session=x-77gw" : "#/chat?device=dev-mbp&kind=claude&session=c-7f3a");
  }
}
const api = createFakeApi({ activeRun: q.get("state") !== "first" });
const onLogin = (kind, device, command) => toast(`将打开 ${device === "dev-mbp" ? "本机" : device} 的终端并输入：${command}`, { title: "在终端登录" });

const shell = renderShell(document.body, {
  sub: "本机", status: { state: "online", label: "已连接 hub.example.com" },
  nav: [
    { path: "/", label: "概览", icon: "layout-dashboard", primary: true },
    { path: "/chat", label: "对话", icon: "message-square", primary: true },
    { path: "/plugins", label: "插件", icon: "puzzle", primary: true },
    { path: "/devices", label: "设备", icon: "monitor", primary: true },
    { path: "/inbox", label: "收件箱", icon: "inbox", badge: 3, primary: true },
    { section: "其他" },
    { path: "/agent", label: "Agent", icon: "bot" },
    { path: "/settings", label: "设置", icon: "settings" },
  ],
});
shell.setActions(appearanceButton());

let cleanup = [];
function context(title, { wide = true } = {}) {
  for (const fn of cleanup) fn();
  cleanup = [];
  shell.setTitle(title, [{ label: "本机", href: "#/" }]);
  shell.page.classList.toggle("wide", wide);
  mount(shell.page);
  window.scrollTo(0, 0);
  return { page: shell.page, shell, every() {}, onLeave(fn) { cleanup.push(fn); } };
}

let card = null;
function overview() {
  const ctx = context("概览");
  card = card || chatCard({ api, local: true });
  card.refresh({ force: true });
  const stat = (label, value, meta) => el("div", { class: "card stat" }, el("span", { class: "stat-label" }, label), el("span", { class: "stat-value" }, value), el("span", { class: "stat-meta" }, meta));
  mount(ctx.page,
    el("div", { class: "page-head overview-head" }, el("div", { class: "titles" }, el("h1", {}, "这台电脑"), el("p", {}, "6 个插件在运行，已连接 hub.example.com。")),
      el("div", { class: "actions" }, el("a", { class: "btn", href: "#/chat" }, icon("message-square", { size: 16 }), "对话"), el("a", { class: "btn btn-primary", href: "#/plugins" }, icon("plus", { size: 16 }), "安装插件"))),
    el("div", { class: "grid cols-4" }, stat("运行中的插件", "6", "全部已启用"), stat("需要处理", "0", "一切正常"), stat("未读邮件", "3", "Agent 发给 me 的"), stat("待回答", "1", "Agent 在等你的回答")),
    el("div", { class: "grid side" }, el("div", { class: "stack lg" }, card.node),
      el("div", { class: "stack lg" }, el("section", { class: "card" }, el("div", { class: "card-head" }, el("h2", {}, "云端连接")), el("div", { class: "card-body" }, el("p", { class: "muted small" }, "已连接 hub.example.com"))))));
}
function placeholder(title) {
  return () => {
    const ctx = context(title);
    mount(ctx.page, el("div", { class: "page-head" }, el("div", { class: "titles" }, el("h1", {}, title), el("p", {}, "（演示页面：切回“对话”时，正在进行的对话和长轮询都还在。）"))));
  };
}

const router = createRouter({
  "/": overview,
  "/chat": (route) => { window.chat = chatPage(context("对话"), route, { api, local: true, onLogin }); },
  "/plugins": placeholder("插件"), "/devices": placeholder("设备"), "/inbox": placeholder("收件箱"),
  "/agent": placeholder("Agent"), "/settings": placeholder("设置"),
}, { fallback: "/" });
router.start();

const later = (ms) => new Promise((r) => setTimeout(r, ms));
(async () => {
  await later(2600);
  if (q.get("side") === "open") document.querySelector(".chat-side-toggle")?.click();
  if (q.get("answer")) document.querySelector(".chat-approval .btn-primary")?.click();
  const menu = q.get("menu");
  const sel = { agent: ".chat-chip-agent", dir: ".chat-chip-dir", more: ".chat-more", perm: ".chat-chip-perm", device: ".chat-chip-device" }[menu];
  if (sel) document.querySelector(sel)?.click();
})();
</script>
</body>
</html>
