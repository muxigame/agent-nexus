# Generic reverse proxy for the agent-nexus gateway. Replace <hub-domain> and the
# certificate paths; the gateway itself listens on 127.0.0.1:8440 (gateway.json).
# /ingress/ carries the device WebSockets; /mcp is the streamable HTTP endpoint.
server {
    listen 443 ssl;
    http2 on;
    server_name <hub-domain>;

    ssl_certificate     /etc/letsencrypt/live/<hub-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<hub-domain>/privkey.pem;

    client_max_body_size 32m;

    location /ingress/ {
        proxy_pass http://127.0.0.1:8440;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Wait URLs (/wait/<token>): the token is the credential, so never write it to a log, and let the
    # plain-text stream run as long as the job (the gateway writes a keepalive line every 50 s unless ?quiet=1).
    location /wait/ {
        access_log off;
        proxy_pass http://127.0.0.1:8440;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:8440;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
