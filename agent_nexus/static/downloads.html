<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>下载 · Agent Nexus</title>
<link rel="icon" href="/console/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/ui.css">
<style>
  .public-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    height: 56px; padding: 0 32px; background: color-mix(in srgb, var(--bg) 92%, transparent); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .public-main { max-width: 1120px; margin: 0 auto; padding: 32px; }
  @media (max-width: 768px) { .public-top { padding: 0 16px; } .public-main { padding: 24px 16px 48px; } }
</style>
</head>
<body>
<header class="public-top" id="top"></header>
<main class="public-main"><div class="stack xl" id="downloads"></div></main>
<script type="module">
import { el, mount, brand, icon, restoreTheme } from "/ui/ui.js";
import { renderDownloads } from "/console/downloads.js";
restoreTheme();
mount(document.getElementById("top"), brand({ href: "/downloads" }),
  el("a", { class: "btn btn-sm", href: "/" }, icon("log-in", { size: 14 }), "登录控制台"));
renderDownloads(document.getElementById("downloads"), { inviteHref: "/#/devices?invite=1", publicPage: true });
</script>
</body>
</html>
