[project]
name = "mcpkit"
version = "0.2.0"
description = "Shared foundation for the WorkSpace/mcp servers: FastMCP 4, one config file, one auth module"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Exact pin: every service that depends on mcpkit runs the same FastMCP.
    "fastmcp==4.0.4",
    # SchemaTool validates published JSON schemas as given.
    "jsonschema>=4.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
