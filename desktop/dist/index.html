<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Nexus — 启动进度</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#657187;--line:#dce3ee;--accent:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--panel:#161b22;--ink:#e6edf3;--muted:#9aa4b2;--line:#2a3341;--accent:#79b8ff}}
*{box-sizing:border-box}body{margin:0;padding:42px 36px;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:850px;margin:auto}h1{font-size:26px;margin:0 0 8px}.sub{color:var(--muted);margin-top:0}.card{margin:24px 0;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.steps{display:flex;gap:12px;flex-wrap:wrap;list-style:none;padding:0}.steps li{padding:6px 10px;border-radius:6px;background:var(--bg);color:var(--muted)}.steps .active{background:var(--accent);color:white}.steps .done{color:#16a34a}#message{font-size:18px;font-weight:600}#elapsed,#root{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.bar{height:4px;background:var(--line);overflow:hidden;border-radius:4px;margin:16px 0}.bar:after{content:"";display:block;width:30%;height:100%;background:var(--accent);animation:travel 1.6s infinite}@keyframes travel{from{transform:translateX(-100%)}to{transform:translateX(430%)}}body.failed .bar:after{animation:none;background:#dc2626;width:100%}body.failed #message{color:#dc2626}pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 Consolas,monospace;padding:14px;max-height:260px;overflow:auto}details{margin-top:18px}summary{cursor:pointer}.note{color:var(--muted);font-size:13px}
</style></head><body><main><h1 id="title">正在启动 Agent Nexus</h1><p class="sub">首次启动会准备 Python 和内置 MCP 的依赖，实际进度与日志会显示在这里。</p>
<div class="card"><ol class="steps"><li>查找配置</li><li>释放程序</li><li>准备环境</li><li>安装依赖</li><li>启动服务</li></ol><div id="message">正在连接启动器…</div><div class="bar"></div><div id="elapsed">已等待 0 秒</div><div id="root"></div><details id="detail"><summary>查看启动日志与失败原因</summary><pre id="logs">等待启动信息…</pre></details><p id="recovery" class="note" hidden>修正上面的错误后，双击 exe 或从托盘右键“打开 / 重试启动”。</p></div>
<p class="note">关闭窗口会留在后台和托盘。托盘右键可打开控制台、管理服务，或退出并停止全部受管服务。</p></main><script>
window.updateStartup=function(state){document.body.classList.toggle('failed',!!state.error);document.querySelector('#title').textContent=state.error?'Agent Nexus启动失败':'正在启动 Agent Nexus';document.querySelector('#message').textContent=state.message;document.querySelector('#elapsed').textContent='已等待 '+state.elapsed+' 秒';document.querySelector('#root').textContent=state.root?'程序目录：'+state.root:'';if(state.logs){document.querySelector('#logs').textContent=state.logs;document.querySelector('#logs').scrollTop=1000000;}document.querySelector('#recovery').hidden=!state.error;if(state.error)document.querySelector('#detail').open=true;document.querySelectorAll('.steps li').forEach((item,index)=>{item.className=!state.error?(index===state.stage?'active':index<state.stage?'done':''):'';});};
</script></body></html>
