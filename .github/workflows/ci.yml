# Continuous integration (docs/design.md §11.2). No job here builds or touches the
# private edition: private builds run only on a maintainer's machine (§11.4).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.21.2"

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Version consistency
        run: uv run --no-project python scripts/version.py check
      - name: Scrub check (generic rules + SCRUB_PATTERNS secret)
        env:
          # Deployment-specific patterns live only in this secret; when it is unset
          # (forks, first run) the generic rules still apply.
          SCRUB_PATTERNS: ${{ secrets.SCRUB_PATTERNS }}
        run: uv run --no-project python scripts/scrub_check.py
      - name: Private guard
        run: |
          set -eu
          found=$(find . -path ./.git -prune -o \( -name secrets -o -name .private -o -name 'build-enrollment*.json' -o -name endpoint-allow \) -print)
          tracked=$(git ls-files | grep -E '(^|/)(secrets|\.private)/|(^|/)build-enrollment[^/]*\.json$|(^|/)endpoint-allow$' || true)
          if [ -n "$found$tracked" ]; then
            echo "private material in the workspace:"; printf '%s\n' $found $tracked
            exit 1
          fi
          # The pattern is split so this file does not match itself.
          if grep -RInE 'build_private''_desktop|--enrollment''-file|ENROLLMENT''_FILE' .github/workflows; then
            echo "a public workflow references the private edition build"; exit 1
          fi
      - name: Gitleaks
        run: |
          set -eu
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - run: uv sync --frozen
      - name: Runtime imports resolve without dev dependencies
        run: uv run --frozen --no-dev --isolated python scripts/check_runtime_imports.py
      - name: pytest (includes tests/compat)
        if: runner.os == 'Windows'
        run: uv run pytest -q
      - name: pytest under xvfb (includes tests/compat)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -q

  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: builtins/mcpkit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  device:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: builtins/device
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest (all tools, contract and conformance)
        if: runner.os == 'Windows'
        run: uv run pytest -q
      - name: pytest (portable tools and the contract; Windows-only desktop control is skipped)
        if: runner.os == 'Linux'
        run: uv run pytest -q --ignore=tests/test_control.py

  # The .deb carries CPython and every locked package: install it and start it
  # with the network cut, exactly as on a machine that cannot reach PyPI.
  ubuntu-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Build the Ubuntu package (offline runtime)
        run: uv run python scripts/build_ubuntu.py --uv "$(command -v uv)" --out build/ubuntu
      - name: Ubuntu package starts with no network
        run: bash scripts/ubuntu_offline_smoke.sh build/ubuntu/agent-nexus_*_amd64.deb
      - name: Ubuntu package on a server without a desktop (join, systemd service)
        run: bash scripts/ubuntu_headless_smoke.sh build/ubuntu/agent-nexus_*_amd64.deb

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.cjs

  desktop-check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Stub runtime archive
        # bootstrap.rs embeds the runtime zip at compile time. Its unit tests unpack it
        # and look for agent_nexus/, mcpm/, builtins/device/ and tools/uv.exe, so the stub
        # is the source runtime without the bundled Python (--online, about 2 s).
        run: |
          uv run --no-project python scripts/build_release.py runtime --online --out "$RUNNER_TEMP/runtime"
          echo "ANX_RUNTIME_ARCHIVE=$RUNNER_TEMP/runtime/agent-nexus-runtime.zip" >> "$GITHUB_ENV"
      - run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
